<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="description"
        content="배달 수입과 지출을 날짜별로 기록하고 세금을 자동 계산하는 앱"
    >

    <meta name="theme-color" content="#0d1117">

    <title>배달 기록장</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <div id="app-shell">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">🛵</div>

                <div>
                    <strong>배달 기록장</strong>
                    <span id="header-month">로딩 중...</span>
                </div>
            </div>

            <div id="sync-badge" class="sync-badge" title="동기화 상태">
                준비 중
            </div>
        </header>

        <main id="main-view" class="main-view"></main>

        <nav class="bottom-nav" aria-label="화면 전환">
            <button
                type="button"
                class="nav-button active"
                data-view="day"
            >
                <span class="nav-icon">✏️</span>
                오늘 입력
            </button>

            <button
                type="button"
                class="nav-button"
                data-view="month"
            >
                <span class="nav-icon">📅</span>
                월별 기록
            </button>

            <button
                type="button"
                class="nav-button"
                data-view="settings"
            >
                <span class="nav-icon">⚙️</span>
                설정
            </button>
        </nav>
    </div>

    <div
        id="toast-container"
        class="toast-container"
        aria-live="polite"
    ></div>

    <script src="js/calc.js"></script>
    <script src="js/data.js"></script>
    <script src="js/dayView.js"></script>
    <script src="js/monthView.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
